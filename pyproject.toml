[project]
name = "dearborn"
version = "0.1.0"
description = "MIDS 266 NLP - Final project. FinRank benchmark"
readme = "README.md"
authors = [
    { name = "David Schaaf", email = "davidschaaf@berkeley.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "modal>=1.5.4",
    "qdrant-client>=1.19.0",
    "sentence-transformers>=6.0.0",
]

[project.scripts]
dearborn = "dearborn.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
