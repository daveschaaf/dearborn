[project]
name = "dearborn"
version = "0.1.0"
description = "MIDS 266 NLP - Final project. FinRank benchmark"
readme = "README.md"
authors = [
    { name = "David Schaaf", email = "davidschaaf@berkeley.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "edgartools>=5.54.0",
    "langchain-qdrant>=1.1.0",
    "linkify>=1.4",
    "linkify-it-py>=2.2.0",
    "markdown-it-py>=4.2.0",
    "modal>=1.5.4",
    "outlines>=1.3.3",
    "pydantic>=2.13.5",
    "qdrant-client>=1.19.0",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.9.0",
    "sec2md>=0.1.23",
    "sentence-transformers>=6.0.0",
    "transformers>=5.16.1",
]

[project.scripts]
dearborn = "dearborn.main:main"
qdrant-up = "dearborn.scripts:qdrant_up"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
